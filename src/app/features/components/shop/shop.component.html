<section class="bg-stone-50 py-14 lg:py-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section Header -->
    <div class="flex items-end justify-between mb-8 lg:mb-10">
      <div>
        <span
          class="inline-block text-xs font-bold tracking-[0.15em] text-orange-500 uppercase mb-2"
        >
          Handpicked For You
        </span>
        <h2 class="text-2xl lg:text-3xl font-bold text-emerald-950 tracking-tight">
          Featured Products
        </h2>
      </div>
      <a
        href="#"
        class="hidden sm:flex items-center gap-1.5 text-sm font-semibold text-emerald-800 hover:text-orange-600 transition-colors"
      >
        View All
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </a>
    </div>

    <!-- Product Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 lg:gap-6">
      @for (product of products(); track product._id) {
        <app-card [product]="product"> </app-card>
      }
    </div>
  </div>
</section>
