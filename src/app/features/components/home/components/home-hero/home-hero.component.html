<section class="relative h-[150px] overflow-hidden bg-white md:h-[50vh] md:min-h-[480px]">
  <div
    class="absolute inset-0 bg-gradient-to-b from-brand-primary/5 via-transparent to-brand-surface"
  ></div>

  <div
    class="hero-card-stage relative mx-auto hidden max-w-6xl items-start justify-center gap-2 px-3 pt-4 md:flex md:h-[62%] md:gap-3 md:px-5 lg:gap-4"
    (mouseenter)="pause()"
    (mouseleave)="resume()"
  >
    @for (product of heroProducts(); track product._id; let i = $index) {
      <a
        [routerLink]="['/product-detail', product.id]"
        class="hero-card group relative overflow-hidden rounded-xl bg-brand-surface shadow-md transition-all duration-500 hover:-translate-y-1.5 hover:shadow-xl"
        [class]="
          heroSlots[i].width +
          ' ' +
          heroSlots[i].offset +
          ' ' +
          (phase() === 'out' ? 'hero-card-out' : 'hero-card-in')
        "
        [style.animation-delay.ms]="i * 90"
      >
        <img
          [src]="product.imageCover"
          [alt]="product.title"
          class="h-full w-full object-cover transition duration-700 group-hover:scale-105"
        />

        <div
          class="absolute inset-0 bg-gradient-to-t from-brand-dark/40 via-transparent to-brand-dark/5"
        ></div>
      </a>
    }
  </div>

  <div
    class="absolute left-1/2 top-[42%] z-20 w-full -translate-x-1/2 -translate-y-1/2 px-4 text-center md:top-[70%]"
  >
    <h1
      class="select-none text-4xl font-black tracking-[-0.04em] text-brand-dark drop-shadow-sm sm:text-5xl md:text-6xl lg:text-7xl"
    >
      Shopping
      <span
        class="bg-gradient-to-r from-brand-primary to-brand-secondary bg-clip-text text-transparent"
      >
        Zone
      </span>
    </h1>

    <p class="mt-3 text-xs font-semibold tracking-wide text-brand-primary/70 sm:mt-5 sm:text-sm">
      All your favorite products
      <span class="text-brand-dark/50">in one zone.</span>
    </p>
  </div>

  <div
    class="absolute bottom-4 left-1/2 z-30 w-[calc(100%-2rem)] max-w-2xl -translate-x-1/2 sm:bottom-5 sm:w-[calc(100%-2.5rem)]"
  >
    <div class="flex items-center rounded-xl bg-brand-surface p-1 shadow-lg shadow-slate-300/20">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-brand-primary/10 text-sm text-brand-primary"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <input
        type="search"
        placeholder="Search products..."
        class="h-10 min-w-0 flex-1 border-0 bg-transparent px-3 text-xs font-medium text-brand-dark outline-none ring-0 placeholder:text-slate-400 focus:border-0 focus:outline-none focus:ring-0 sm:text-sm"
      />

      <button
        type="button"
        aria-label="Search"
        class="flex h-11 shrink-0 items-center justify-center rounded-lg bg-brand-dark px-3 text-xs font-semibold text-white transition hover:bg-brand-primary sm:px-5 sm:text-sm"
      >
        <span class="hidden sm:inline">Search</span>
        <i class="fa-solid fa-arrow-right sm:ml-2"></i>
      </button>
    </div>
  </div>
</section>
